# Swarm imports the Worker package (infrastructure/worker) and its workspace
# template from the repository checkout, so install it in editable mode:
#   pip install -e infrastructure/swarm
[project]
name = "swarm"
version = "0.1.0"
description = "Coordinates the builder agents that turn a research paper into a research environment"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "flask",
    "pyyaml",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
swarm = "swarm.cli:main"

[tool.setuptools.packages.find]
include = ["swarm*"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
